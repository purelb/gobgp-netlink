name: ci

on: [push, pull_request]

jobs:
  # Note: Cross-compilation to non-Linux platforms is not supported.
  # The netlink integration feature uses vishvananda/netlink which is Linux-only.

  unit:
    name: unit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - run: |
          go test -v -race -timeout 240s ./...
          if [ "$(go env GOARCH)" = "amd64" ]; then go test -v -race github.com/osrg/gobgp/v4/pkg/packet/bgp -run ^Test_RaceCondition$; else echo 'skip'; fi

  # Note: 32-bit builds removed as netlink feature is Linux-only and targets modern 64-bit systems

  protobuf-check:
    name: protobuf lint and format check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # buf-setup-action still declares node20 and there is no release that
      # does not - v1.50.0 (Jan 2025) is the latest and GitHub forces it onto
      # node24 - so that deprecation warning cannot be cleared here.
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: latest
          # It resolves the buf release through the GitHub API; without a token
          # that is the anonymous rate limit, which this job now leans on for
          # three steps rather than two.
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf lint
        run: buf lint proto/

      - name: buf format check
        run: buf format --diff --exit-code

      # proto/buf.yaml has declared `breaking: use: [FILE]` since the config was
      # written, but nothing ever ran it. A wire-breaking change - a reused field
      # number, a changed type - reached main unremarked.
      # Only meaningful on a pull request: the question is "what would merging
      # this change for a consumer", and after it lands main is its own
      # baseline. A deliberate break - the planned field renumbering - is
      # allowed through by labelling the PR `proto-break`, which leaves the
      # intent recorded on the PR rather than in a commit that edits this file
      # twice.
      - name: buf breaking
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'proto-break')
        run: buf breaking proto/ --against "https://github.com/purelb/gobgp-netlink.git#branch=main,subdir=proto"

      # api/*.pb.go is generated and committed. Nothing checked that it still
      # matches the .proto, so a hand edit or a stale regeneration was invisible.
      - name: buf generate is up to date
        working-directory: proto
        run: |
          buf generate
          cd ..
          if ! git diff --exit-code -- api/; then
            echo "::error::api/ is stale - run 'buf generate proto/' and commit the result"
            exit 1
          fi

  yang-check:
    name: generated YANG files check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The model repositories are pinned. osrg/public and osrg/yang are forks
      # that stopped tracking upstream, but osrg/pyang follows upstream pyang,
      # where a new release can change the generated output. Without a pin, an
      # unrelated pull request starts failing here. These land under
      # .yang-models/, which is untracked, so the diff check below ignores them.
      - uses: actions/checkout@v7
        with:
          repository: osrg/public
          ref: 0d3376ef325b982124de8360e00eb36fc6367de5
          path: .yang-models/public
      - uses: actions/checkout@v7
        with:
          repository: osrg/yang
          ref: 63f9a3563c2b31832e9e2046529fa61f3d31f6dd
          path: .yang-models/yang
      - uses: actions/checkout@v7
        with:
          repository: osrg/pyang
          ref: fc9a965c3ae80688cc2889aefa183cf1aa6d55c2
          path: .yang-models/pyang

      # pyang imports pkg_resources, which setuptools 82 removes.
      - name: install pyang dependencies
        run: python -m pip install 'setuptools<82' -r .yang-models/pyang/requirements.txt

      # shell: bash adds -o pipefail, so pyang's exit status is not hidden by
      # gofmt. Write to a temporary file so a failed run leaves the checked-in
      # file alone.
      - name: generate YANG files
        shell: bash
        run: |
          models="$GITHUB_WORKSPACE/.yang-models"
          cd "$models/pyang"
          source ./env.sh
          PYTHONPATH=. ./bin/pyang --plugindir "$GITHUB_WORKSPACE/tools/pyang_plugins" \
            -p "$models/yang/standard/ietf/RFC" \
            -p "$models/public/release/models" \
            -p "$models/public/release/models/bgp" \
            -p "$models/public/release/models/policy" \
            -f golang \
            "$models/public/release/models/policy/openconfig-routing-policy.yang" \
            "$models/public/release/models/bgp/openconfig-bgp.yang" \
            "$GITHUB_WORKSPACE/tools/pyang_plugins/gobgp.yang" \
            | gofmt > "$RUNNER_TEMP/bgp_configs.go"
          mv "$RUNNER_TEMP/bgp_configs.go" "$GITHUB_WORKSPACE/pkg/config/oc/bgp_configs.go"

      - name: generated files are up to date
        run: git diff --exit-code

  golangci:
    name: lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          skip-cache: true

  embedded:
    name: embedded
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - run: |
          python test/scenario_test/ci-scripts/build_embedded_go.py docs/sources/lib.md
          python test/scenario_test/ci-scripts/build_embedded_go.py docs/sources/bgp-ls.md

  lintdoc:
    name: lintdoc
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"

      # Nothing checked the files that define all 41 jobs. A workflow can be
      # valid YAML and still be rejected by GitHub: a step with two `with:`
      # blocks parses fine, because YAML keeps the last duplicate key, and the
      # run then starts with zero jobs and a bare "workflow file issue" - which
      # presents as an empty check list rather than a red one. actionlint
      # rejects that, along with unknown keys, bad `needs:` references and
      # undefined context expressions.
      #
      # Its shellcheck integration is off. It reports 33 findings here and all
      # of them are false: 30 are SC2209 on lines like
      #   PYTHONPATH=test python3 -m pytest ...
      # where shellcheck reads `test` as the shell builtin rather than this
      # repository's directory. Leaving it on would mean 33 permanent warnings
      # and a check nobody reads.
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color -shellcheck=

      - run: |
          npm install markdownlint-cli
          ./node_modules/.bin/markdownlint $(find . -type d -name 'node_modules' -prune -o -type f -name '*.md' -print)
          sudo apt-get install python3-setuptools
          sudo pip3 install scspell3k
          tools/spell-check/scspell.sh
          tools/grep_avoided_functions.sh

  build:
    name: build container image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - name: container image
        run: |
          sudo apt-get install python3-setuptools
          sudo pip3 install -r test/pip-requires.txt
          fab -r test/lib make-gobgp-ctn --tag gobgp --from-image osrg/quagga
          docker save gobgp > gobgp.tar
          fab -r test/lib make-gobgp-ctn --tag gobgp-oq --from-image osrg/quagga:v1.0
          docker save gobgp-oq > gobgp-oq.tar

      - name: upload image file
        uses: actions/upload-artifact@v7
        with:
          name: artifact
          path: |
            gobgp.tar
            gobgp-oq.tar

  router:
    name: router
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: artifact
          path: artifact
      - name: test
        run: |
          docker load < artifact/gobgp.tar
          sudo apt-get install python3-setuptools
          sudo pip3 install -r test/pip-requires.txt
          PYTHONPATH=test python3 -m pytest test/scenario_test/bgp_router_test.py --gobgp-image gobgp -x -s

