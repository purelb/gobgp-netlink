      - uses: actions/download-artifact@v8
        with:
          name: artifact
          path: artifact
      - name: test
        run: |
          docker load < artifact/gobgp.tar
          sudo apt-get install python3-setuptools
          sudo pip3 install -r test/pip-requires.txt
          PYTHONPATH=test python3 -m pytest test/scenario_test/mup_test.py --gobgp-image gobgp -x -s

  netlink:
    name: netlink
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: artifact
          path: artifact
      - name: test
        run: |
          docker load < artifact/gobgp.tar
          # Run test in privileged container with VRF support
          docker run --rm --privileged \
            --entrypoint /bin/bash \
            -v $(pwd)/test:/test \
            gobgp \
            -c "/test/scenario_test/netlink_test.sh"

  # Summary job for branch protection - reports single "ci" status
  crossbuild:
    name: crossbuild
    strategy:
      matrix:
        GOOS: ["freebsd", "openbsd", "darwin", "windows"]
        GOARCH: ["amd64"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - run: |
          go env
          go build ./cmd/gobgp
          go build ./cmd/gobgpd
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
  tcp-md5:
    name: tcp-md5
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: artifact
          path: artifact
      - name: test
        run: |
          docker load < artifact/gobgp.tar
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r)
          sudo modprobe vrf
          sudo pip3 install -r test/pip-requires.txt
          PYTHONPATH=test python3 -m pytest test/scenario_test/tcp_md5_test.py --gobgp-image gobgp -x -s
  unit386:
    name: unit386
    runs-on: ubuntu-24.04
    env:
      GOARCH: 386
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - run: |
          sudo apt update
          sudo apt install -y gcc-multilib g++-multilib
          go env GOARCH CGO_ENABLED
          go test -v -timeout 240s ./...

  ci:
    name: ci
    runs-on: ubuntu-22.04
    if: always()
    needs:
      - unit
      - unit386
      - crossbuild
      - tcp-md5
      - protobuf-check
      - yang-check
      - golangci
      - embedded
      - lintdoc
      - build
      - router
      - evpn
      - flowspec
      - global-policy
      - graceful-restart
      - ibgp
      - rr
      - as2
      - ipv4-v6
      - malformed
      - rs-policy-grpc
      - rs-policy
      - softreset
      - rs1
      - rs2
      - llgr
      - vrf-neighbor1
      - vrf-neighbor2
      - rtc
      - unnumbered
      - aspath
      - addpath
      - malformed-handling
      - confederation
      - zebra
      - zebra-nht
      - zapi-v3
      - zapi-v3-multipath
      - mup
      - netlink
    steps:
      - name: Check all jobs passed
        run: |
          results="${{ needs.unit.result }} ${{ needs.protobuf-check.result }} ${{ needs.golangci.result }} ${{ needs.embedded.result }} ${{ needs.lintdoc.result }} ${{ needs.build.result }} ${{ needs.router.result }} ${{ needs.evpn.result }} ${{ needs.flowspec.result }} ${{ needs.global-policy.result }} ${{ needs.graceful-restart.result }} ${{ needs.ibgp.result }} ${{ needs.rr.result }} ${{ needs.as2.result }} ${{ needs.ipv4-v6.result }} ${{ needs.malformed.result }} ${{ needs.rs-policy-grpc.result }} ${{ needs.rs-policy.result }} ${{ needs.softreset.result }} ${{ needs.rs1.result }} ${{ needs.rs2.result }} ${{ needs.llgr.result }} ${{ needs.vrf-neighbor1.result }} ${{ needs.vrf-neighbor2.result }} ${{ needs.rtc.result }} ${{ needs.unnumbered.result }} ${{ needs.aspath.result }} ${{ needs.addpath.result }} ${{ needs.malformed-handling.result }} ${{ needs.confederation.result }} ${{ needs.zebra.result }} ${{ needs.zebra-nht.result }} ${{ needs.zapi-v3.result }} ${{ needs.zapi-v3-multipath.result }} ${{ needs.mup.result }} ${{ needs.netlink.result }}"
          for result in $results; do
            if [[ "$result" != "success" ]]; then
              echo "One or more jobs failed"
              exit 1
            fi
          done
          echo "All jobs passed"
